name: Daily battle

on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:

concurrency:
  group: quorum
  cancel-in-progress: true

jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Simulate today's battle
        run: python -m quorum

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/quorum.svg
          git diff --staged --quiet || git commit -m "⚔️ $(date -u +%Y-%m-%d)"
          git push

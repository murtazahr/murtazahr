name: Game of Life

on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  push:
    branches: [main]
    paths: ["life/**", ".github/workflows/life.yml"]
  workflow_dispatch:

concurrency:
  group: life
  cancel-in-progress: true

jobs:
  life:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Play today's game
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python -m life

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/life.svg
          git diff --staged --quiet || git commit -m "🧬 $(date -u +%Y-%m-%d)"
          git push
